
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>My Budget Tracker</h1>
        <p>Manage your money wisely</p>
    </header>

    <nav class="navigation">
        <a href="#dashboard">Dashboard</a>
        <a href="#transactions">Transactions</a>
        <a href="#about">About</a>
    </nav>

    <main class="container" id="dashboard">
        <h2>Dashboard</h2>

        <section class="summary">
            <article class="card">
                <h3>Total Income</h3>
                <p class="amount">Ksh 0.00</p>
            </article>

            <article class="card">
                <h3>Total Expenses</h3>
                <p class="amount">Ksh 0.00</p>
            </article>

            <article class="card">
                <h3>Balance</h3>
                <p class="amount">Ksh 0.00</p>
            </article>
        </section>

        <section class="transactions" id="transactions">
            <h2>Recent Transactions</h2>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td colspan="4">No transactions yet.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer id="about">
        <p>My Budget Tracker &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
